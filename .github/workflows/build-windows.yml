name: Build TSRealDriver Windows x64

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -A x64 -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path package | Out-Null
          Copy-Item build\Release\TSRealDriver.dll package\TSRealDriver.dll
          Copy-Item build\Release\TSRealDriverConfig.exe package\TSRealDriverConfig.exe
          Copy-Item TSRealDriver.ini package\TSRealDriver.ini
          Copy-Item README.md package\README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: TSRealDriver-0.5.3-GameCamera-ScanCode-Windows-x64
          path: package
          if-no-files-found: error
